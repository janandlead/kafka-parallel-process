spring.application.name=kafka-consumer-group-parallel-processing

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-parallel-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.javacodeex.kafka.parallel.model.Order
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.javacodeex.kafka.parallel.model

app.kafka.topic=orders-parallel
app.kafka.partitions=3
app.kafka.replication-factor=1
app.kafka.consumer-concurrency=3
